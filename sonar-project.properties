sonar.projectKey=sequeless-filter
sonar.organization=sequeless
sonar.host.url=https://sonarcloud.io

# Source/test layout is discovered from the Maven reactor; these tune analysis scope.
sonar.exclusions=**/generated/**,**/target/**
sonar.coverage.exclusions=**/*Application.java,**/config/**,**/package-info.java

# JaCoCo XML report (Lombok-generated members carry @lombok.Generated and are excluded).
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
