name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: sequeless/sequeless-build/.github/workflows/maven-ci.yml@63bad368fc4122d19c8555293012ac58eb3b6fac # workflows-v0.1.2
    secrets: inherit
